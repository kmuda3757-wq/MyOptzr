name: Build SigmaOptimizer.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cari file .csproj
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter "PCOptimizerApp.csproj" | Select-Object -First 1
          if (-not $proj) {
            Write-Error "PCOptimizerApp.csproj tidak ditemukan di repo ini. Cek struktur folder hasil upload."
            exit 1
          }
          Write-Host "Ketemu di: $($proj.FullName)"
          echo "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        run: >
          dotnet publish "${{ steps.findproj.outputs.path }}" -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Upload exe sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SigmaOptimizer-exe
          path: dist/SigmaOptimizer.exe
